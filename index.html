<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis de Probabilidad - PRODE 2026</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6">

    <div class="w-full max-w-4xl bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
        <div class="mb-6">
            <h2 class="text-2xl font-bold text-emerald-400">Distribución de Resultados Exactos</h2>
            <p class="text-slate-400 text-sm mt-1">Comparativa: Histórico Mundial (2014-2022) vs. Realidad Mundial 2026</p>
        </div>
        
        <div class="relative w-full h-[400px]">
            <canvas id="prodeChart"></canvas>
        </div>
        
        <div class="mt-4 text-xs text-slate-500 text-right">
            * Basado en un total de 7 partidos disputados en la ronda actual (2026).
        </div>
    </div>

    <script>
        const ctx = document.getElementById('prodeChart').getContext('2d');
        
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['2-1 / 1-2', '1-1', '2-0 / 0-2', '3-1 / 1-3', '1-0 / 0-1', '3-0 / 0-3', '4-0 / 0-4'],
                datasets: [
                    {
                        label: 'Probabilidad Histórica (%)',
                        data: [25.00, 25.00, 12.50, 8.33, 8.33, 4.17, 0.00],
                        backgroundColor: 'rgba(148, 163, 184, 0.2)', // Slate-400 transparente
                        borderColor: 'rgba(148, 163, 184, 1)',
                        borderWidth: 1.5,
                        borderRadius: 4,
                        barPercentage: 0.6,
                        categoryPercentage: 0.7
                    },
                    {
                        label: 'Frecuencia Real 2026 (%)',
                        data: [28.57, 28.57, 14.29, 0.00, 0.00, 14.29, 0.00],
                        backgroundColor: 'rgba(52, 211, 153, 0.75)', // Emerald-400 con opacidad
                        borderColor: 'rgba(52, 211, 153, 1)',
                        borderWidth: 2,
                        borderRadius: 4,
                        barPercentage: 0.6,
                        categoryPercentage: 0.7
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'top',
                        labels: {
                            color: '#cbd5e1', // Slate-300
                            font: {
                                size: 13,
                                family: 'ui-sans-serif, system-ui, sans-serif'
                            },
                            boxWidth: 15
                        }
                    },
                    tooltip: {
                        backgroundColor: '#0f172a', // Slate-900
                        titleColor: '#34d399', // Emerald-400
                        bodyColor: '#f8fafc',
                        callbacks: {
                            label: function(context) {
                                return context.dataset.label + ': ' + context.raw.toFixed(2) + '%';
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        grid: {
                            display: false
                        },
                        ticks: {
                            color: '#94a3b8', // Slate-400
                            font: {
                                size: 12
                            }
                        }
                    },
                    y: {
                        grid: {
                            color: 'rgba(51, 65, 85, 0.5)' // Slate-700 sutil
                        },
                        ticks: {
                            color: '#94a3b8',
                            font: {
                                size: 12
                            },
                            callback: function(value) {
                                return value + '%';
                            }
                        },
                        min: 0,
                        max: 35
                    }
                }
            }
        });
    </script>
</body>
</html>
